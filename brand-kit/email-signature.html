<!--
  Signature email Asia Unseen.
  Copiez le contenu de <table> dans votre client (Gmail : Paramètres → Signature).
  Tableau + styles en ligne : c'est la seule construction qui survive à Outlook.
  Remplacez [Prénom Nom] et [Rôle].
-->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Helvetica, Arial, sans-serif; color: #0A0A0A;">
  <tr>
    <td style="padding-right: 18px; border-right: 2px solid #E5E7EB; vertical-align: top;">
      <img src="https://asiaunseen.com/icon-192.png" width="52" height="52" alt="Asia Unseen" style="display:block; border-radius:10px;">
    </td>
    <td style="padding-left: 18px; vertical-align: top;">
      <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.2px;">[Prénom Nom]</div>
      <div style="font-size: 13px; color: #6B7280; padding-top: 2px;">[Rôle] — Asia Unseen</div>
      <div style="height: 10px; line-height: 10px;">&nbsp;</div>
      <div style="font-size: 13px;">
        <a href="https://asiaunseen.com" style="color: #0F766E; text-decoration: none; font-weight: 600;">asiaunseen.com</a>
        <span style="color: #E5E7EB;">&nbsp;|&nbsp;</span>
        <a href="mailto:bonjour@asiaunseen.com" style="color: #6B7280; text-decoration: none;">bonjour@asiaunseen.com</a>
      </div>
      <div style="height: 10px; line-height: 10px;">&nbsp;</div>
      <div style="font-size: 11px; color: #9CA3AF; letter-spacing: 1.5px; text-transform: uppercase;">L'Asie, sans filtre</div>
    </td>
  </tr>
</table>
