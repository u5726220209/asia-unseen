name: Contrôle mécanique

# Tout ce qu'une machine sait vérifier sans jugement : le site compile, les
# titres et descriptions tiennent dans ce que Google affiche, aucun lien interne
# ne pointe dans le vide, aucun montant publié n'en contredit un autre, aucun
# lien affilié ne perd sa commission, aucune source externe n'est morte.
#
# Ce contrôle tourne à chaque poussée et bloque la mise en ligne s'il échoue :
# c'est le filet qui empêche qu'une correction faite dans l'urgence casse
# autre chose.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  controler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # En premier : si les noms des réglages ne concordent pas, tout le reste
      # est contrôlé sur un site auquel il manque des morceaux, sans le dire.
      - name: Concordance des réglages
        run: npm run config
      # Les garde-fous de la rédaction automatique. Ils bloquent au lieu
      # d'avertir : un avertissement suppose quelqu'un pour le lire, ce qui
      # est précisément ce qui manque quand personne ne relit.
      - name: Garde-fous de la rédaction automatique
        run: npm run garde-fous
      - name: Compiler
        run: npm run build
      - name: Audit mécanique
        run: npm run audit
      - name: Liens internes
        run: npm run verifier
      # Deux contrôles hors ligne : nos montants publiés se contredisent-ils
      # d'une page à l'autre, et les liens des programmes ouverts portent-ils
      # bien leur identifiant. Les deux sont des fautes de notre côté, donc
      # bloquantes ; ce que disent les sources et les partenaires relève de la
      # veille, qui alerte sans bloquer.
      - name: Montants publiés
        run: npm run chiffres -- --hors-ligne
      - name: Liens affiliés
        run: npm run affilies -- --hors-ligne
      # Le poids ne dérape jamais d'un coup : il monte d'un cran à chaque
      # révision, et personne ne remarque le cran du jour. Le budget refuse
      # au moment où l'on sait encore quel changement l'a causé.
      - name: Budget de performance
        run: npm run performance
      # Et pour finir : les contrôles ci-dessus bloquent-ils encore ?
      #
      # Ils ont chacun été mis en échec une fois à la main le jour de leur
      # écriture, jamais depuis. Leur panne ne produit aucune erreur — elle
      # produit un « ✓ ». Cette suite réintroduit dans chacun le défaut qu'il
      # vise et exige qu'il refuse. Elle passe en dernier : elle modifie des
      # fichiers puis les restaure, et rien ne doit dépendre de son passage.
      # Le script qui remonte les dates de vérification écrit dans
      # `countries.ts` à des positions calculées. Une position juste-à-côté
      # n'échoue pas : elle écrit une date exacte sur le mauvais champ, le
      # fichier reste valide, et le site affiche une date qui ment. Ce mode
      # relit ses propres repères avant qu'ils servent.
      - name: Les repères de la date de vérification
        run: npm run reperes

      - name: Les garde-fous bloquent-ils encore
        run: npm run gardes

      # Le site tel qu'il sera quand tout aura paru.
      #
      # Vingt-neuf textes anglais sont écrits et programmés sur onze semaines.
      # Tant qu'ils n'ont pas paru ils n'ont pas de page, et tous les contrôles
      # ci-dessus lisent `dist/` : ils regardent un site amputé de la moitié de
      # ce qui est écrit, et affichent « ✓ » en toute bonne foi.
      #
      # Cette simulation décale les dates vers le passé, en gardant leur ordre,
      # et relance la batterie. Dès sa première exécution elle a trouvé trois
      # titres trop longs pour Google, qui seraient apparus un à un entre
      # septembre et décembre — chacun le matin de sa parution, le seul matin
      # où plus personne ne relit. Elle passe après les garde-fous, pour la
      # même raison qu'eux : elle réécrit des fichiers puis les restaure.
      - name: Le site quand tout aura paru
        run: npm run parutions

      - name: Sources externes
        run: npm run sources || echo "Des sources n'ont pas répondu — souvent un blocage anti-robot, à vérifier à la main."
