name: Contrôle mécanique

# Tout ce qu'une machine sait vérifier sans jugement : le site compile, les
# titres et descriptions tiennent dans ce que Google affiche, aucun lien interne
# ne pointe dans le vide, aucun montant publié n'en contredit un autre, aucun
# lien affilié ne perd sa commission, aucune source externe n'est morte.
#
# Ce contrôle tourne à chaque poussée et bloque la mise en ligne s'il échoue :
# c'est le filet qui empêche qu'une correction faite dans l'urgence casse
# autre chose.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  controler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # En premier : si les noms des réglages ne concordent pas, tout le reste
      # est contrôlé sur un site auquel il manque des morceaux, sans le dire.
      - name: Concordance des réglages
        run: npm run config
      # Les garde-fous de la rédaction automatique. Ils bloquent au lieu
      # d'avertir : un avertissement suppose quelqu'un pour le lire, ce qui
      # est précisément ce qui manque quand personne ne relit.
      - name: Garde-fous de la rédaction automatique
        run: npm run garde-fous
      - name: Compiler
        run: npm run build
      - name: Audit mécanique
        run: npm run audit
      - name: Liens internes
        run: npm run verifier
      # Deux contrôles hors ligne : nos montants publiés se contredisent-ils
      # d'une page à l'autre, et les liens des programmes ouverts portent-ils
      # bien leur identifiant. Les deux sont des fautes de notre côté, donc
      # bloquantes ; ce que disent les sources et les partenaires relève de la
      # veille, qui alerte sans bloquer.
      - name: Montants publiés
        run: npm run chiffres -- --hors-ligne
      - name: Liens affiliés
        run: npm run affilies -- --hors-ligne
      # Le poids ne dérape jamais d'un coup : il monte d'un cran à chaque
      # révision, et personne ne remarque le cran du jour. Le budget refuse
      # au moment où l'on sait encore quel changement l'a causé.
      - name: Budget de performance
        run: npm run performance
      - name: Sources externes
        run: npm run sources || echo "Des sources n'ont pas répondu — souvent un blocage anti-robot, à vérifier à la main."
