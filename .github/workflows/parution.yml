name: Parution quotidienne

# Le site est reconstruit chaque matin, qu'il y ait eu un changement ou non.
#
# C'est ce qui fait exister la programmation : un article daté du 1er octobre
# est invisible jusqu'au 30 septembre au soir, puis la construction du 1er le
# fait apparaître. Sans ce rendez-vous quotidien, une date future n'aurait
# aucun effet — le site resterait figé à la dernière poussée de code.
#
# La construction sert aussi de garde-fou passif : si une dépendance casse ou
# si une donnée devient invalide, on le sait le lendemain, pas le jour où on
# voulait publier quelque chose d'urgent.
on:
  schedule:
    - cron: '10 6 * * *'   # 8 h 10 heure de Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      - name: Ce qui attend son tour
        run: node scripts/programme.mjs

      - name: Reconstituer la configuration
        run: |
          # Les variables sont écrites une par une, avec exactement les noms que
          # le code lit. Un nom approchant ne provoque aucune erreur : le site se
          # construit, et la publicité ou le lien affilié disparaît en silence.
          # C'est le genre de panne qu'on ne découvre qu'à la facture.
          cat > .env <<'FIN'
          PUBLIC_SITE_URL=https://asiaunseen.com
          PUBLIC_ADSENSE_CLIENT=${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_IN_ARTICLE=${{ secrets.PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}
          PUBLIC_ADSENSE_SLOT_IN_FEED=${{ secrets.PUBLIC_ADSENSE_SLOT_IN_FEED }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR=${{ secrets.PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_LAYOUT_IN_FEED=${{ secrets.PUBLIC_ADSENSE_LAYOUT_IN_FEED }}
          PUBLIC_GA4_ID=${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_GSC_TOKEN=${{ secrets.PUBLIC_GSC_TOKEN }}
          PUBLIC_AFF_BOOKING=${{ secrets.PUBLIC_AFF_BOOKING }}
          PUBLIC_AFF_BOOKING_TEMPLATE=${{ secrets.PUBLIC_AFF_BOOKING_TEMPLATE }}
          PUBLIC_AFF_AGODA=${{ secrets.PUBLIC_AFF_AGODA }}
          PUBLIC_AFF_12GO=${{ secrets.PUBLIC_AFF_12GO }}
          PUBLIC_AFF_GETYOURGUIDE=${{ secrets.PUBLIC_AFF_GETYOURGUIDE }}
          PUBLIC_AFF_AIRALO=${{ secrets.PUBLIC_AFF_AIRALO }}
          PUBLIC_AFF_HOLAFLY=${{ secrets.PUBLIC_AFF_HOLAFLY }}
          PUBLIC_AFF_CHAPKA=${{ secrets.PUBLIC_AFF_CHAPKA }}
          PUBLIC_AFF_WISE=${{ secrets.PUBLIC_AFF_WISE }}
          PUBLIC_NEWSLETTER_ENDPOINT=${{ secrets.PUBLIC_NEWSLETTER_ENDPOINT }}
          PUBLIC_NEWSLETTER_CHAMP=${{ secrets.PUBLIC_NEWSLETTER_CHAMP }}
          FIN

      - run: npm run build

      # Les mêmes contrôles que sur une poussée de code : une parution
      # automatique ne mérite pas moins de vigilance qu'une manuelle.
      - name: Contrôles avant envoi
        run: |
          node scripts/audit-seo.mjs
          node scripts/verifier-liens.mjs
          node scripts/verifier-chiffres.mjs --hors-ligne
          node scripts/liens-affilies.mjs --hors-ligne

      # Une seconde chance : « Timeout (control socket) » est un incident
      # réseau côté hébergeur, sans rapport avec le contenu envoyé, et il
      # transformait sinon dix secondes d'indisponibilité en article non
      # publié. Si les deux essais échouent, l'étape échoue vraiment.
      - name: Envoyer sur l'hébergement
        id: envoi
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOTE }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOTDEPASSE }}
          local-dir: ./dist/
          # Le compte FTP est cloisonné dans le dossier du site : la connexion
          # y arrive déjà. Ajouter « public_html/ » créait un public_html dans
          # public_html — le transfert réussissait, le site ne changeait pas,
          # et le double devenait du contenu dupliqué indexable.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Réessayer le transfert
        if: steps.envoi.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOTE }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOTDEPASSE }}
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Le gardien confirme
        run: |
          # ── Attendre que le serveur ait fini de se poser ────────────
          #
          # Le contrôle était un `sleep 30` suivi d'une seule tentative. Il a
          # échoué quatorze fois sur trente-sept, toujours de la même façon :
          # 403 sur tout — sitemap, robots.txt, jeu de données — et version.txt
          # absent. Ce n'est pas un déploiement raté, c'est un déploiement
          # photographié pendant qu'il se fait. Le transfert remplace aussi
          # .htaccess, et pendant ce remplacement Apache refuse tout.
          #
          # Un échec sur trois est pire qu'aucun contrôle : il apprend à
          # ignorer la croix rouge, et le jour où elle signale une vraie panne,
          # personne ne la regarde. On attend donc que la version servie soit
          # la bonne, jusqu'à quatre minutes — puis on lance le gardien complet.
          #
          # La rigueur est intacte : si la bonne version n'apparaît jamais, ou
          # si le gardien trouve autre chose, l'étape échoue toujours.
          attendu="$(git rev-parse --short HEAD)"
          for i in $(seq 1 24); do
            servi="$(curl -sf --max-time 10 https://asiaunseen.com/version.txt | head -1 | tr -d '[:space:]' || true)"
            if [ "$servi" = "$attendu" ]; then
              echo "Version $attendu servie après $((i * 10)) s."
              break
            fi
            [ "$i" = "24" ] && echo "Toujours « ${servi:-rien} » après 4 min — le gardien va le dire."
            sleep 10
          done

          node scripts/gardien.mjs --attendu "$attendu"
