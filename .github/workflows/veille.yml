name: Veille quotidienne

# La sentinelle passe chaque matin à 6 h heure de Paris. Elle ne corrige rien :
# elle ouvre une tâche quand une source officielle a bougé, et la referme quand
# tout est stable. Lire un texte administratif et décider de la nouvelle règle
# reste un travail humain — c'est la seule chose que ce site refuse d'automatiser.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Sources officielles
        id: sentinelle
        run: |
          node scripts/veille.mjs --json-vers rapport-veille.json > rapport-veille.txt 2>&1 && echo "change=non" >> $GITHUB_OUTPUT || echo "change=oui" >> $GITHUB_OUTPUT
          cat rapport-veille.txt

      # La seule chose que cette veille corrige d'elle-même, et elle ne corrige
      # rien d'autre : la date affichée sur une fiche.
      #
      # Cette date était saisie à la main, donc figée dès que personne n'y
      # pensait — sept fiches sur neuf affichaient août au 4 septembre pendant
      # que la sentinelle relisait leurs sources chaque nuit. La machine
      # vérifiait, et la page prétendait le contraire.
      #
      # La condition est stricte : toutes les sources du pays relues, aucune
      # qui ait bougé. Une source injoignable suffit à ne rien toucher. Écrire
      # une règle reste humain ; constater qu'une source n'a pas bougé ne l'est
      # pas, et n'a jamais eu de raison de l'être.
      - name: Fraîcheur des fiches
        run: node scripts/rafraichir.mjs --veille rapport-veille.json

      - name: Échéances de vérification
        id: fraicheur
        run: |
          node scripts/fraicheur.mjs > rapport-fraicheur.txt 2>&1 && echo "du=non" >> $GITHUB_OUTPUT || echo "du=oui" >> $GITHUB_OUTPUT
          cat rapport-fraicheur.txt

      # Les tarifs cités noir sur blanc dans les comparatifs. La sentinelle des
      # sources voit qu'une page a changé ; celle-ci dit lequel de nos montants
      # est devenu faux. Sans dist/, elle ne juge que les sources.
      - name: Chiffres publiés
        id: chiffres
        run: |
          code=0
          node scripts/verifier-chiffres.mjs > rapport-chiffres.txt 2>&1 || code=$?
          cat rapport-chiffres.txt
          if [ $code -eq 0 ]; then echo "faux=non" >> $GITHUB_OUTPUT; else echo "faux=oui" >> $GITHUB_OUTPUT; fi

      # Les portails d'État laissent régulièrement expirer leur certificat.
      # Nous ne pouvons pas le réparer ; nous pouvons prévenir le lecteur
      # avant qu'il tombe sur un avertissement rouge en pleine page.
      - name: Certificats des portails officiels
        id: certificats
        run: |
          code=0
          node scripts/certificats.mjs > rapport-certificats.txt 2>&1 || code=$?
          cat rapport-certificats.txt
          if [ $code -eq 0 ]; then echo "risque=non" >> $GITHUB_OUTPUT; else echo "risque=oui" >> $GITHUB_OUTPUT; fi

      # Une licence relevée un jour n'est pas acquise pour toujours : un fichier
      # peut être supprimé de Commons, une licence corrigée après coup. Le site
      # afficherait alors un crédit faux, ou publierait sans droit.
      - name: Licences photographiques
        id: licences
        run: |
          code=0
          node scripts/licences.mjs > rapport-licences.txt 2>&1 || code=$?
          cat rapport-licences.txt
          if [ $code -eq 0 ]; then echo "souci=non" >> $GITHUB_OUTPUT; else echo "souci=oui" >> $GITHUB_OUTPUT; fi

      # Le seul garde-fou tourné vers l'extérieur. Une sanction de Google
      # n'arrive pas par courrier : les pages sortent de l'index et le site
      # continue de répondre parfaitement. Sans ce relevé, on s'en aperçoit
      # à la baisse des revenus, des mois plus tard.
      # Les quatre-vingt-dix-neuf adresses qui sortent du site. Une source
      # morte laisse la phrase qu'elle appuyait en place et fait disparaître la
      # preuve ; un lien partenaire mort ne rapporte plus rien et ne le dit pas.
      # Il faut dist/, donc la construction précède.
      # Deux de nos pages qui visent la même recherche partagent le signal au
      # lieu de l'additionner, et aucune ne se classe. C'est le seul problème
      # de référencement qu'écrire n'améliore pas : un troisième article sur le
      # même sujet l'aggrave. Constat seulement — un chevauchement peut être
      # délibéré.
      - name: Pages qui se disputent une recherche
        run: |
          node scripts/cannibalisation.mjs > rapport-cannibalisation.txt 2>&1 || true
          cat rapport-cannibalisation.txt
        env:
          GSC_CLE_JSON: ${{ secrets.GSC_CLE_JSON }}

      # Une fois par semaine, pas chaque nuit.
      #
      # Cette étape est la seule de la veille qui reconstruit le site entier :
      # elle a besoin de dist/ pour recenser les liens, et c'est de loin la plus
      # coûteuse en minutes. Or un lien externe ne meurt pas du jour au
      # lendemain. Le lundi suffit — et la condition est écrite en shell plutôt
      # qu'en expression de workflow, parce qu'une condition qu'on ne sait pas
      # relire est une condition qu'on n'ose plus modifier.
      - name: Liens sortants
        id: externes
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Contrôle hebdomadaire — il tourne le lundi." > rapport-externes.txt
            cat rapport-externes.txt
            echo "morts=non" >> $GITHUB_OUTPUT
            exit 0
          fi
          npm ci --silent && npm run build > /dev/null 2>&1
          code=0
          node scripts/liens-externes.mjs > rapport-externes.txt 2>&1 || code=$?
          cat rapport-externes.txt
          if [ $code -eq 0 ]; then echo "morts=non" >> $GITHUB_OUTPUT; else echo "morts=oui" >> $GITHUB_OUTPUT; fi

      - name: Trafic
        id: trafic
        run: |
          code=0
          node scripts/trafic.mjs > rapport-trafic.txt 2>&1 || code=$?
          cat rapport-trafic.txt
          if [ $code -eq 0 ]; then echo "chute=non" >> $GITHUB_OUTPUT; else echo "chute=oui" >> $GITHUB_OUTPUT; fi
        env:
          GSC_CLE_JSON: ${{ secrets.GSC_CLE_JSON }}

      - name: Ouvrir une tâche si quelque chose a bougé
        if: steps.sentinelle.outputs.change == 'oui' || steps.fraicheur.outputs.du == 'oui' || steps.chiffres.outputs.faux == 'oui' || steps.certificats.outputs.risque == 'oui' || steps.licences.outputs.souci == 'oui' || steps.trafic.outputs.chute == 'oui' || steps.externes.outputs.morts == 'oui'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const veille = fs.readFileSync('rapport-veille.txt', 'utf8');
            const fraicheur = fs.readFileSync('rapport-fraicheur.txt', 'utf8');
            const chiffres = fs.readFileSync('rapport-chiffres.txt', 'utf8');
            const certificats = fs.readFileSync('rapport-certificats.txt', 'utf8');
            const licences = fs.readFileSync('rapport-licences.txt', 'utf8');
            const trafic = fs.readFileSync('rapport-trafic.txt', 'utf8');
            const externes = fs.existsSync('rapport-externes.txt')
              ? fs.readFileSync('rapport-externes.txt', 'utf8') : '';
            const titre = 'Veille — des sources ont bougé ou des fiches sont dues';
            const corps = [
              '_Rapport automatique. La machine signale, elle ne conclut pas._',
              '',
              '## Sources officielles',
              '```', veille.trim(), '```',
              '',
              '## Échéances',
              '```', fraicheur.trim(), '```',
              '',
              '## Montants publiés',
              '```', chiffres.trim(), '```',
              '',
              '## Certificats des portails officiels',
              '```', certificats.trim(), '```',
              '',
              '## Licences photographiques',
              '```', licences.trim(), '```',
              '',
              '## Trafic',
              '```', trafic.trim(), '```',
              ...(externes ? ['', '## Liens sortants', '```', externes.trim(), '```'] : []),
              '',
              '## Ce qu\'il reste à faire, à la main',
              '1. Ouvrir la source et lire la règle, ou le tarif, tel qu\'il est écrit.',
              '2. Corriger `src/data/countries.ts` si elle a changé.',
              '3. Ajouter l\'entrée dans `src/data/corrections.ts`, avec l\'avant, l\'après et la source.',
              '4. Remonter `verifieLe`.',
              '5. Pousser : la mise en ligne se fait toute seule.',
            ].join('\n');

            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'veille',
            });
            if (ouvertes.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['veille'],
              });
            }

      - name: Refermer la tâche si tout est stable
        if: steps.sentinelle.outputs.change == 'non' && steps.fraicheur.outputs.du == 'non' && steps.chiffres.outputs.faux == 'non' && steps.certificats.outputs.risque == 'non' && steps.licences.outputs.souci == 'non' && steps.trafic.outputs.chute == 'non'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'veille',
            });
            for (const i of ouvertes) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: 'Tout est redevenu stable : aucune source n\'a bougé et aucune fiche n\'est due.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }

      # L'état n'est mémorisé que si une source a réellement bougé. Sans cette
      # condition, la sentinelle réécrirait le fichier chaque matin, ce qui
      # déclencherait un contrôle puis une mise en ligne quotidiens pour rien.
      # Ce commit déclenche volontairement une republication. La page « État de
      # la veille » affiche la date du dernier relevé de chaque source : sans
      # reconstruction, elle montrerait celle de la dernière mise en ligne, ce
      # qui en ferait une page d'état périmée — le contraire de son objet.
      # Aucune réaction en chaîne à craindre : la mise en ligne ne pousse rien.
      # Deux fichiers de mémoire, enregistrés ensemble : l'empreinte des sources
      # officielles, et le relevé hebdomadaire de trafic. Ce dernier était écrit
      # puis perdu à chaque passage, faute d'être enregistré — l'alerte
      # fonctionnait, mais aucune tendance ne pouvait se construire.
      - name: Mémoriser l'état des sources et le relevé de trafic
        if: always()
        run: |
          if [ "${{ steps.sentinelle.outputs.change }}" = "oui" ]; then
            node scripts/veille.mjs --init > /dev/null 2>&1 || true
          fi
          SUIVIS="src/data/veille-empreintes.json src/data/trafic-historique.json src/data/countries.ts"
          if ! git diff --quiet -- $SUIVIS 2>/dev/null; then
            git config user.name  "Sentinelle"
            git config user.email "actions@users.noreply.github.com"
            git add -- $SUIVIS
            # Pas de [skip ci] : une date de vérification qui remonte doit
            # atteindre le site, sinon elle n'aura bougé que dans le dépôt.
            # Le contrôle mécanique passe derrière et bloque si besoin.
            git commit -m "Veille : état des sources, fraîcheur des fiches et relevé de trafic"
            git push
          fi
