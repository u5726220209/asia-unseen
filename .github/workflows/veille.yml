name: Veille quotidienne

# La sentinelle passe chaque matin à 6 h heure de Paris. Elle ne corrige rien :
# elle ouvre une tâche quand une source officielle a bougé, et la referme quand
# tout est stable. Lire un texte administratif et décider de la nouvelle règle
# reste un travail humain — c'est la seule chose que ce site refuse d'automatiser.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Sources officielles
        id: sentinelle
        run: |
          node scripts/veille.mjs > rapport-veille.txt 2>&1 && echo "change=non" >> $GITHUB_OUTPUT || echo "change=oui" >> $GITHUB_OUTPUT
          cat rapport-veille.txt

      - name: Échéances de vérification
        id: fraicheur
        run: |
          node scripts/fraicheur.mjs > rapport-fraicheur.txt 2>&1 && echo "du=non" >> $GITHUB_OUTPUT || echo "du=oui" >> $GITHUB_OUTPUT
          cat rapport-fraicheur.txt

      # Les tarifs cités noir sur blanc dans les comparatifs. La sentinelle des
      # sources voit qu'une page a changé ; celle-ci dit lequel de nos montants
      # est devenu faux. Sans dist/, elle ne juge que les sources.
      - name: Chiffres publiés
        id: chiffres
        run: |
          code=0
          node scripts/verifier-chiffres.mjs > rapport-chiffres.txt 2>&1 || code=$?
          cat rapport-chiffres.txt
          if [ $code -eq 0 ]; then echo "faux=non" >> $GITHUB_OUTPUT; else echo "faux=oui" >> $GITHUB_OUTPUT; fi

      # Les portails d'État laissent régulièrement expirer leur certificat.
      # Nous ne pouvons pas le réparer ; nous pouvons prévenir le lecteur
      # avant qu'il tombe sur un avertissement rouge en pleine page.
      - name: Certificats des portails officiels
        id: certificats
        run: |
          code=0
          node scripts/certificats.mjs > rapport-certificats.txt 2>&1 || code=$?
          cat rapport-certificats.txt
          if [ $code -eq 0 ]; then echo "risque=non" >> $GITHUB_OUTPUT; else echo "risque=oui" >> $GITHUB_OUTPUT; fi

      # Une licence relevée un jour n'est pas acquise pour toujours : un fichier
      # peut être supprimé de Commons, une licence corrigée après coup. Le site
      # afficherait alors un crédit faux, ou publierait sans droit.
      - name: Licences photographiques
        id: licences
        run: |
          code=0
          node scripts/licences.mjs > rapport-licences.txt 2>&1 || code=$?
          cat rapport-licences.txt
          if [ $code -eq 0 ]; then echo "souci=non" >> $GITHUB_OUTPUT; else echo "souci=oui" >> $GITHUB_OUTPUT; fi

      - name: Ouvrir une tâche si quelque chose a bougé
        if: steps.sentinelle.outputs.change == 'oui' || steps.fraicheur.outputs.du == 'oui' || steps.chiffres.outputs.faux == 'oui' || steps.certificats.outputs.risque == 'oui' || steps.licences.outputs.souci == 'oui'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const veille = fs.readFileSync('rapport-veille.txt', 'utf8');
            const fraicheur = fs.readFileSync('rapport-fraicheur.txt', 'utf8');
            const chiffres = fs.readFileSync('rapport-chiffres.txt', 'utf8');
            const certificats = fs.readFileSync('rapport-certificats.txt', 'utf8');
            const licences = fs.readFileSync('rapport-licences.txt', 'utf8');
            const titre = 'Veille — des sources ont bougé ou des fiches sont dues';
            const corps = [
              '_Rapport automatique. La machine signale, elle ne conclut pas._',
              '',
              '## Sources officielles',
              '```', veille.trim(), '```',
              '',
              '## Échéances',
              '```', fraicheur.trim(), '```',
              '',
              '## Montants publiés',
              '```', chiffres.trim(), '```',
              '',
              '## Certificats des portails officiels',
              '```', certificats.trim(), '```',
              '',
              '## Licences photographiques',
              '```', licences.trim(), '```',
              '',
              '## Ce qu\'il reste à faire, à la main',
              '1. Ouvrir la source et lire la règle, ou le tarif, tel qu\'il est écrit.',
              '2. Corriger `src/data/countries.ts` si elle a changé.',
              '3. Ajouter l\'entrée dans `src/data/corrections.ts`, avec l\'avant, l\'après et la source.',
              '4. Remonter `verifieLe`.',
              '5. Pousser : la mise en ligne se fait toute seule.',
            ].join('\n');

            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'veille',
            });
            if (ouvertes.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes[0].number, body: corps,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['veille'],
              });
            }

      - name: Refermer la tâche si tout est stable
        if: steps.sentinelle.outputs.change == 'non' && steps.fraicheur.outputs.du == 'non' && steps.chiffres.outputs.faux == 'non' && steps.certificats.outputs.risque == 'non' && steps.licences.outputs.souci == 'non'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'veille',
            });
            for (const i of ouvertes) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: 'Tout est redevenu stable : aucune source n\'a bougé et aucune fiche n\'est due.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }

      # L'état n'est mémorisé que si une source a réellement bougé. Sans cette
      # condition, la sentinelle réécrirait le fichier chaque matin, ce qui
      # déclencherait un contrôle puis une mise en ligne quotidiens pour rien.
      # Le marqueur [skip ci] empêche par ailleurs toute réaction en chaîne.
      - name: Mémoriser le nouvel état des sources
        if: steps.sentinelle.outputs.change == 'oui'
        run: |
          node scripts/veille.mjs --init > /dev/null 2>&1 || true
          if ! git diff --quiet src/data/veille-empreintes.json; then
            git config user.name  "Sentinelle"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/veille-empreintes.json
            git commit -m "Veille : nouvel état des sources officielles [skip ci]"
            git push
          fi
